<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Arial, Helvetica, sans-serif" font-size="12" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Wiring schematic: Pro Micro to Casio SA-77 keybed</title>
<desc>Pro Micro pins 2 to 7 connect to the six matrix rows and pins 10, 14, 15, 16, 18, 19, 20, 21 connect to the eight matrix columns of the Casio SA-77 keybed. Pins 8 and 9 are free. The board connects to the PC over USB.</desc>
<rect x="0.5" y="0.5" width="759" height="559" rx="8" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="20" y="22" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Wiring schematic: Pro Micro to Casio SA-77 keybed</text>
<rect x="60" y="40" width="160" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="140" y="57" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2C2C2A">PC / FL Studio</text>
<line x1="140" y1="74" x2="140" y2="100" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="150" y="87" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">USB MIDI</text>
<rect x="60" y="100" width="160" height="392" rx="6" fill="#F8F7F3" stroke="#5F5E5A"/>
<text x="140" y="116" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2C2C2A">Pro Micro</text>
<text x="140" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">ATmega32U4, 5V 16 MHz</text>
<rect x="520" y="100" width="200" height="392" rx="6" fill="#F8F7F3" stroke="#5F5E5A"/>
<text x="620" y="116" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2C2C2A">Casio SA-77 keybed</text>
<text x="620" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">6 x 8 matrix, 44 keys</text>
<text x="210" y="150" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">2</text>
<line x1="220" y1="150" x2="520" y2="150" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="220" cy="150" r="3" fill="#0F6E56"/>
<circle cx="520" cy="150" r="3" fill="#0F6E56"/>
<text x="532" y="150" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#0F6E56">Matrix row 2</text>
<text x="210" y="171" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">3</text>
<line x1="220" y1="171" x2="520" y2="171" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="220" cy="171" r="3" fill="#0F6E56"/>
<circle cx="520" cy="171" r="3" fill="#0F6E56"/>
<text x="532" y="171" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#0F6E56">Matrix row 3</text>
<text x="210" y="192" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">4</text>
<line x1="220" y1="192" x2="520" y2="192" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="220" cy="192" r="3" fill="#0F6E56"/>
<circle cx="520" cy="192" r="3" fill="#0F6E56"/>
<text x="532" y="192" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#0F6E56">Matrix row 4</text>
<text x="210" y="213" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">5</text>
<line x1="220" y1="213" x2="520" y2="213" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="220" cy="213" r="3" fill="#0F6E56"/>
<circle cx="520" cy="213" r="3" fill="#0F6E56"/>
<text x="532" y="213" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#0F6E56">Matrix row 5</text>
<text x="210" y="234" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">6</text>
<line x1="220" y1="234" x2="520" y2="234" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="220" cy="234" r="3" fill="#0F6E56"/>
<circle cx="520" cy="234" r="3" fill="#0F6E56"/>
<text x="532" y="234" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#0F6E56">Matrix row 6</text>
<text x="210" y="255" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">7</text>
<line x1="220" y1="255" x2="520" y2="255" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="220" cy="255" r="3" fill="#0F6E56"/>
<circle cx="520" cy="255" r="3" fill="#0F6E56"/>
<text x="532" y="255" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#0F6E56">Matrix row 7</text>
<text x="210" y="276" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">8</text>
<line x1="220" y1="276" x2="270" y2="276" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="280" y="276" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#5F5E5A">free (reserved)</text>
<text x="210" y="297" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">9</text>
<line x1="220" y1="297" x2="270" y2="297" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="280" y="297" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#5F5E5A">free (reserved)</text>
<text x="210" y="318" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">10</text>
<line x1="220" y1="318" x2="520" y2="318" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="318" r="3" fill="#534AB7"/>
<circle cx="520" cy="318" r="3" fill="#534AB7"/>
<text x="532" y="318" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 10</text>
<text x="210" y="339" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">14 (MISO)</text>
<line x1="220" y1="339" x2="520" y2="339" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="339" r="3" fill="#534AB7"/>
<circle cx="520" cy="339" r="3" fill="#534AB7"/>
<text x="532" y="339" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 14</text>
<text x="210" y="360" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">15 (SCK)</text>
<line x1="220" y1="360" x2="520" y2="360" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="360" r="3" fill="#534AB7"/>
<circle cx="520" cy="360" r="3" fill="#534AB7"/>
<text x="532" y="360" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 15</text>
<text x="210" y="381" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">16 (MOSI)</text>
<line x1="220" y1="381" x2="520" y2="381" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="381" r="3" fill="#534AB7"/>
<circle cx="520" cy="381" r="3" fill="#534AB7"/>
<text x="532" y="381" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 16</text>
<text x="210" y="402" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">18 (A0)</text>
<line x1="220" y1="402" x2="520" y2="402" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="402" r="3" fill="#534AB7"/>
<circle cx="520" cy="402" r="3" fill="#534AB7"/>
<text x="532" y="402" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 18</text>
<text x="210" y="423" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">19 (A1)</text>
<line x1="220" y1="423" x2="520" y2="423" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="423" r="3" fill="#534AB7"/>
<circle cx="520" cy="423" r="3" fill="#534AB7"/>
<text x="532" y="423" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 19</text>
<text x="210" y="444" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">20 (A2)</text>
<line x1="220" y1="444" x2="520" y2="444" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="444" r="3" fill="#534AB7"/>
<circle cx="520" cy="444" r="3" fill="#534AB7"/>
<text x="532" y="444" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 20</text>
<text x="210" y="465" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">21 (A3)</text>
<line x1="220" y1="465" x2="520" y2="465" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="220" cy="465" r="3" fill="#534AB7"/>
<circle cx="520" cy="465" r="3" fill="#534AB7"/>
<text x="532" y="465" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#534AB7">Matrix column 21</text>
<line x1="60" y1="512" x2="84" y2="512" stroke="#0F6E56" stroke-width="1.5"/>
<text x="92" y="512" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">Row (output, driven LOW one at a time)</text>
<line x1="360" y1="512" x2="384" y2="512" stroke="#534AB7" stroke-width="1.5"/>
<text x="392" y="512" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">Column (input, internal pull-up)</text>
<text x="60" y="536" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="normal" fill="#2C2C2A">A pressed key connects its row to its column, so the column reads LOW while that row is active.</text>
</svg>
